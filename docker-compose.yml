services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - LLM_BASE_URL=http://host.docker.internal:8080/v1
      - LLM_MODEL=mlx-community/Qwen2.5-14B-Instruct-8bit
      - LLM_API_KEY=not-needed
      - DATA_DIR=/app/data
      - CORS_ORIGINS=["http://localhost:5173"]
      - LOG_LEVEL=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./data:/app/data
    command: sh -c "uv sync --frozen --no-dev && uv run uvicorn app:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
